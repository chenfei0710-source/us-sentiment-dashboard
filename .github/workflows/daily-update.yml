name: 美股情绪仪表盘每日更新

on:
  schedule:
    - cron: "0 8 * * 1-5"    # 盘前：UTC 08:00 = 北京 16:00
    - cron: "30 20 * * 1-5"   # 盘后：UTC 20:30 = 美东 16:30
  workflow_dispatch:
    inputs:
      mode:
        description: "pre / post"
        default: "pre"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests yfinance pytz

      - name: Run pre-market update
        if: github.event.schedule == '0 8 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'post')
        run: python tracker.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: chenfei0710-source
          GITHUB_REPO: us-sentiment-dashboard

      - name: Run post-market SPX update
        if: github.event.schedule == '30 20 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'post')
        run: python tracker.py --post-market
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: chenfei0710-source
          GITHUB_REPO: us-sentiment-dashboard

      - name: Commit and push
        run: |
          git config user.name "Sentiment Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html us_sentiment_history.json status.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "自动更新 $(date +%Y-%m-%d)"
          git push

      - name: Double-check live page
        run: |
          echo "等待 GitHub Pages CDN 刷新..."
          sleep 30
          python3 - <<PYEOF
import requests, json, sys
page = requests.get("https://chenfei0710-source.github.io/us-sentiment-dashboard/", timeout=15).text
status = json.load(open("status.json")) if __import__("os").path.exists("status.json") else {}
errors = []
spx = str(status.get("spx_close",""))
if spx and spx.replace(".","").isdigit():
    formatted = f"{float(spx):,.2f}"
    if formatted not in page:
        errors.append(f"SPX {formatted} 不在线上页面")
from datetime import date
today = date.today().strftime("%Y年%-m月%-d日")
if today not in page:
    errors.append(f"日期 {today} 不在线上页面")
if errors:
    print("⚠️  Double-check 发现问题:")
    for e in errors: print("  -", e)
    sys.exit(1)
else:
    print("✅ Double-check 通过")
PYEOF
