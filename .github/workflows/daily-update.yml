name: 美股情绪仪表盘每日更新

on:
  schedule:
    - cron: "0 8 * * 1-5"
    - cron: "30 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "pre or post"
        default: "pre"
        type: string
  push:
    branches:
      - main
    paths:
      - "trigger-update.txt"

permissions:
  contents: write

jobs:
  pre-market:
    if: github.event_name != 'schedule' || github.event.schedule == '0 8 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests yfinance pytz beautifulsoup4
      - run: python tracker.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "Sentiment Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html us_sentiment_history.json status.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "盘前自动更新 $(date +%Y-%m-%d)"
          git push

  post-market:
    if: github.event_name == 'schedule' && github.event.schedule == '30 20 * * 1-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests yfinance pytz beautifulsoup4
      - run: python tracker.py --post-market
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "Sentiment Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html us_sentiment_history.json status.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "盘后SPX更新 $(date +%Y-%m-%d)"
          git push
